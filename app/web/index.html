<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyPetDatabase 検索</title>
<style>
:root{--bg:#f6f5f1;--fg:#222;--muted:#6b6b66;--card:#fff;--line:#e2e0d8;--accent:#2f6f5e;--used:#2f6f5e;--approx:#b9770e;--pending:#8a8a85;--unknown:#b03a2e}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#eceae3;--muted:#9a9a93;--card:#1f1f1c;--line:#34342f;--accent:#6fbfa8;--used:#6fbfa8;--approx:#e0a94a;--pending:#8d8d86;--unknown:#e07a6e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Yu Gothic UI","Meiryo",system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:1200px;margin:0 auto}
h1{font-size:18px;margin:0 0 12px;font-weight:600}
form{display:flex;gap:8px}
input[type=search]{flex:1;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
button{font:inherit;padding:10px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
main{max-width:1200px;margin:0 auto;padding:0 16px 40px}
.examples{color:var(--muted);font-size:13px;margin:8px 0}
.examples a{color:var(--accent);cursor:pointer;margin-right:12px;text-decoration:none;border-bottom:1px dotted var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip i{font-style:normal;font-size:11px;padding:1px 7px;border-radius:999px;color:#fff}
.chip.used i{background:var(--used)}.chip.approx i{background:var(--approx)}.chip.pending{opacity:.65}.chip.pending i{background:var(--pending)}.chip.unknown i{background:var(--unknown)}
.chip.pending b{text-decoration:line-through;text-decoration-color:var(--pending)}
.note{font-size:13px;color:var(--muted);margin:4px 0}
.layout{display:grid;grid-template-columns:200px 1fr;gap:20px;margin-top:8px}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
aside h3{font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600}
aside .btns{display:flex;flex-wrap:wrap;gap:6px}
aside .btns button{padding:4px 10px;font-size:13px;background:var(--card);color:var(--fg);border:1px solid var(--line)}
aside label{display:block;font-size:13px;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.tile img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#8883}
.tile .meta{padding:6px 8px;font-size:12px;color:var(--muted)}
.tile .meta b{color:var(--fg);font-weight:500}
.badge{display:inline-block;font-size:11px;padding:0 7px;border-radius:999px;background:var(--line);color:var(--fg);margin-left:4px}
.total{margin:8px 0;font-size:14px}
.more{text-align:center;margin:20px}
dialog{border:0;border-radius:12px;padding:0;max-width:96vw;background:var(--card);color:var(--fg)}
dialog::backdrop{background:#000b}
.lb{display:flex;flex-direction:column;max-height:94vh}
.lb .view{flex:1;display:flex;justify-content:center;background:#000;min-height:200px}
.lb img,.lb video{max-width:94vw;max-height:76vh;object-fit:contain}
.lb .info{padding:10px 14px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lb .path{flex:1;word-break:break-all;color:var(--muted)}
.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)}
.tile{position:relative}
.tile.sel{outline:3px solid var(--accent)}
.tile .ck{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:#000a;color:#fff;display:none;align-items:center;justify-content:center;font-size:14px}
.selmode .tile .ck{display:flex}.tile.sel .ck{background:var(--accent)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:8px;display:none;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.selmode .bar{display:flex}
.bar select,.bar input[type=text]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.bar button{padding:5px 12px;font-size:13px}
.panel{display:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:13px;background:var(--card)}
.panel.on{display:block}.panel input[type=range]{width:220px;vertical-align:middle}
.sim{float:right}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin:8px 0}
.fc{position:relative;cursor:pointer;border:3px solid transparent;border-radius:8px;overflow:hidden;background:#8883}
.fc img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.fc.on{border-color:var(--accent)}.fc.off{opacity:.35}
.fc small{position:absolute;right:3px;bottom:3px;background:#000a;color:#fff;border-radius:6px;padding:0 5px;font-size:11px}
.cl{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:10px 0}
.cl .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
#facePanel button{padding:5px 12px;font-size:13px}
.pl{background:var(--accent);color:#fff}.pl.ai{background:var(--approx)}
</style>
</head>
<body>
<header>
  <h1>MyPetDatabase 検索</h1>
  <form id="f"><input id="q" type="search" placeholder="例: ペットの名前や、場面・年で探せます" autofocus><button>検索</button></form>
  <div class="examples"></div>
</header>
<main>
  <div class="panel" id="anaPanel" style="margin-top:8px"></div>
  <div class="chips" id="chips"></div>
  <div class="note" id="note"></div>
  <div class="layout">
    <aside>
      <h3>ペット</h3><div class="btns" id="fpets"></div>
      <h3>年</h3><div class="btns" id="fyears"></div>
      <h3>種類</h3><div class="btns" id="fkinds"></div>
      <h3>場所</h3><div class="btns" id="fplaces"></div>
      <h3>場面</h3><div class="btns" id="fscenes"></div>
      <h3>人物</h3><div class="btns" id="fpersons"></div>
      <h3>表示</h3>
      <label><input type="checkbox" id="oOld"> 古い順</label>
      <label><input type="checkbox" id="oLoose"> あいまいな判定も含める</label>
      <label><input type="checkbox" id="oNonlive"> 遺影・置物の候補も含める</label>
      <label><input type="checkbox" id="oAi"> AI生成の画像も含める</label>
    </aside>
    <section>
      <div class="total" id="total"></div>
      <div style="margin-bottom:8px"><button class="ghost" id="selBtn">場所を付ける（選択モード）</button> <button class="ghost" id="faceBtn">顔に名前を付ける</button> <button class="ghost" id="petBtn">ペットに名前を付ける</button> <button class="ghost" id="albBtn">アルバムに書き出す</button></div>
      <div class="panel" id="albPanel">
        <b>アルバムに書き出す</b> <span class="note">表示中の検索結果（選択モードで選んだ写真があれば、それだけ）を、別のフォルダにまとめます。元のファイルは変わりません。</span><br>
        <div style="margin:6px 0">書き出し先 <input type="text" id="albDest" size="34" placeholder="例: D:\アルバム"> の下に、フォルダ <input type="text" id="albName" size="18" placeholder="アルバムの名前"> を作る</div>
        <div style="margin:6px 0"><label><input type="radio" name="albMode" value="copy" checked> コピー（安全。容量が増える）</label>
          <label><input type="radio" name="albMode" value="link"> リンク（同じドライブなら容量を使わない。できなければコピー）</label></div>
        <button id="albGo">書き出す</button> <button class="ghost" id="albCancel" style="display:none">中止</button> <span id="albMsg" class="note"></span>
      </div>
      <div class="panel" id="facePanel">
        <b>顔に名前を付ける</b> <span id="fInfo" class="note"></span><br>
        人物: <select id="fSel" style="font:inherit;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)"></select>
        <button class="ghost" id="fNew">＋ 新しい人物</button>
        <button class="ghost" id="fTabCl">グループで付ける</button> <button class="ghost" id="fTabSim">似た顔を探す</button> <button class="ghost" id="fTabRv">名前を見直す</button>
        <div id="fBody"></div>
      </div>
      <div class="panel" id="petPanel">
        <b>ペットに名前を付ける</b> <span id="pInfo" class="note"></span><br>
        ペット: <select id="ptSel" style="font:inherit;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)"></select>
        <button class="ghost" id="ptNew">＋ 新しいペット</button>
        <button class="ghost" id="ptTabCl">グループで付ける</button> <button class="ghost" id="ptTabSim">似た写真を探す</button> <button class="ghost" id="ptTabRv">名前を見直す</button>
        <button class="ghost" id="ptId" title="付けた名前を見本にして、残りの写真を判定し直します（メニュー11と同じ）">判定をやり直す</button> <span id="ptJob" class="note"></span>
        <div id="ptBody"></div>
      </div>
      <div class="bar" id="bar">
        <label><input type="radio" name="ptype" value="place" checked> 場所</label><label><input type="radio" name="ptype" value="tag"> 場面</label>
        <select id="plSel"></select>
        <button class="ghost" id="plNew">＋ 新しく追加</button>
        <button id="plAdd">選んだ写真に付ける</button>
        <button class="ghost" id="plNeg">ではない</button>
        <button class="ghost" id="plRem">取り消す</button>
        <button class="ghost" id="selAll">すべて選ぶ</button><button class="ghost" id="selNone">選択解除</button>
        <button class="ghost" id="plSug">似た写真を探す</button>
        <span id="selN"></span>
      </div>
      <div class="panel" id="panel">
        <b id="pTitle"></b>：見本 <span id="pLab">0</span> 枚。似ている写真を、しきい値以上で自動でこの場所にします。<br>
        しきい値 <input type="range" id="thr" min="0.6" max="0.98" step="0.01"> <span id="thrV"></span>
        → 自動で付く写真 <b id="pCnt">-</b> 枚 <small id="pRec"></small>
        <button id="pApply">この設定で自動で付ける</button> <button class="ghost" id="pClear" title="人が付けた見本は残し、自動で付いた分だけを消します">自動判定を消す</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="more"><button class="ghost" id="more" hidden>もっと見る</button></div>
    </section>
  </div>
</main>
<dialog id="dlg"><div class="lb"><div class="view" id="view"></div>
  <div class="info"><button class="ghost" id="prev">←</button><button class="ghost" id="next">→</button>
  <span id="when"></span><span class="path" id="path"></span><button class="ghost" id="copy">場所をコピー</button><button class="ghost" id="close">閉じる</button></div></div></dialog>
<script>
const $=s=>document.querySelector(s), LIMIT=60;
let items=[], offset=0, total=0, cur=-1, query="", seq=0;
const STATUS={used:"使用中",approx:"近似",pending:"未対応",unknown:"不明"};
function opts(){return "&order="+($("#oOld").checked?"old":"new")+($("#oLoose").checked?"&loose=1":"")+($("#oNonlive").checked?"&nonlive=1":"")+($("#oAi").checked?"&ai=1":"")}
async function api(u){const r=await fetch(u);const j=await r.json();if(j.error)throw new Error(j.error);return j}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function chips(conds){
  $("#chips").innerHTML=conds.map(c=>`<span class="chip ${c.status}" title="${esc(c.detail)}"><i>${STATUS[c.status]}</i><b>${esc(c.label)}</b></span>`).join("");
}
async function search(q,more){
  query=q; if(!more){offset=0;items=[]} sugMode=null; $("#panel").classList.remove("on");
  const my=++seq; $("#total").textContent="検索中…";
  try{
    const j=await api(`/api/search?q=${encodeURIComponent(q)}&limit=${LIMIT}&offset=${offset}${opts()}`);
    if(my!==seq) return;       // 新しい検索が始まっていれば、古い結果は捨てる
    chips(j.parsed.conds); $("#note").textContent=j.note||"";
    const pend=j.parsed.conds.filter(c=>c.status==="pending");
    if(pend.length) $("#note").textContent=("未対応の条件（"+pend.map(c=>c.label).join("、")+"）は、判定が完成するまで検索に使いません。 ")+($("#note").textContent);
    total=j.total; items=items.concat(j.items); offset=items.length;
    $("#total").textContent=total?`${total.toLocaleString()} 件`:""; render(); $("#more").hidden=items.length>=total;
    if(!total) $("#grid").innerHTML='<div class="empty">該当する写真・動画はありません</div>';
  }catch(e){$("#grid").innerHTML='<div class="empty">エラー: '+esc(e.message)+'</div>'}
}
function render(){
  $("#grid").innerHTML=items.map((it,i)=>`<div class="tile${sel.has(it.id)?" sel":""}" data-i="${i}" data-id="${it.id}"><span class="ck">✓</span><img loading="lazy" src="/thumb/${it.id}" alt="">
   <div class="meta">${it.sim!=null&&sugMode?`<span class="sim">${it.sim.toFixed(2)}</span>`:""}<b>${esc(it.date||"日付不明")}</b>${(it.persons||[]).map(p=>`<span class="badge pl ${p.src}">👤${esc(p.name)}${p.src==="ai"?"（AI）":""}</span>`).join("")}${(it.places||[]).map(p=>`<span class="badge pl ${p.src}">${esc(p.name)}${p.src==="ai"?"（AI）":""}</span>`).join("")}${it.kind==="video"?'<span class="badge">動画</span>':""}${it.pets.map(p=>`<span class="badge">${esc(p)}</span>`).join("")}${it.nonlive?'<span class="badge">遺影等の候補</span>':""}</div></div>`).join("");
}
function show(i){
  if(i<0||i>=items.length)return; cur=i; const it=items[i];
  $("#view").innerHTML=it.kind==="video"?`<video controls autoplay src="/file/${it.id}"></video>`:`<img src="/file/${it.id}" alt="">`;
  $("#when").textContent=it.date||"日付不明"; $("#path").textContent=it.path;
  if(!$("#dlg").open)$("#dlg").showModal();
}
$("#grid").addEventListener("click",e=>{const t=e.target.closest(".tile");if(!t)return;
  if(selMode&&!e.target.closest("img.zoom")){const id=+t.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);updSel();return}
  show(+t.dataset.i)});
$("#grid").addEventListener("dblclick",e=>{const t=e.target.closest(".tile");if(t&&selMode)show(+t.dataset.i)});
$("#prev").onclick=()=>show(cur-1); $("#next").onclick=()=>show(cur+1);
$("#close").onclick=()=>{$("#view").innerHTML="";$("#dlg").close()};
$("#dlg").addEventListener("close",()=>{$("#view").innerHTML=""});
$("#copy").onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($("#path").textContent);
document.addEventListener("keydown",e=>{if(!$("#dlg").open)return;if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});
$("#more").onclick=()=>search(query,true);
$("#f").onsubmit=e=>{e.preventDefault();search($("#q").value.trim())};
document.querySelector(".examples").addEventListener("click",e=>{const a=e.target.closest("a");if(a){$("#q").value=a.dataset.q;search(a.dataset.q)}});
["oOld","oLoose","oNonlive","oAi"].forEach(id=>$("#"+id).onchange=()=>{if(query)search(query)});
function add(word){const q=$("#q");q.value=(q.value+" "+word).trim();search(q.value)}

// ---- アルバム書き出し
try{$("#albDest").value=localStorage.getItem("albDest")||""}catch(e){}
$("#albBtn").onclick=()=>{const on=!$("#albPanel").classList.contains("on");$("#albPanel").classList.toggle("on",on);if(on&&!$("#albName").value)$("#albName").value=(query||"アルバム").replace(/[<>:"\/\\|?*]/g,"_").slice(0,40)};
let albT=null;
async function albPoll(){
  try{
    const j=await api("/api/album/status");
    if(j.idle)return;
    if(j.running){$("#albMsg").textContent=`書き出し中… ${j.n.toLocaleString()} / ${j.total.toLocaleString()}`;$("#albCancel").style.display="";albT=setTimeout(albPoll,700);return}
    $("#albCancel").style.display="none";$("#albGo").disabled=false;
    if(j.error){$("#albMsg").textContent="失敗: "+j.error;return}
    const r=j.result;const gb=r.bytes/1073741824;
    $("#albMsg").textContent=`完了: ${r.done.toLocaleString()} 件を書き出しました（${gb>=1?gb.toFixed(1)+" GB":(r.bytes/1048576).toFixed(0)+" MB"}${r.linked?`、うちリンク ${r.linked} 件`:""}）。`+(r.missing?` 元のファイルが見つからないもの ${r.missing} 件（外付けドライブが接続されているか、確認してください）。`:"")+(r.n_failed?` 失敗 ${r.n_failed} 件（一覧のCSVに記録）。`:"")+` 場所: ${r.dir}`;
  }catch(e){$("#albMsg").textContent=e.message}
}
$("#albGo").onclick=async()=>{
  const dest=$("#albDest").value.trim(), name=$("#albName").value.trim();
  const ids=sel.size?[...sel]:[];
  const n=ids.length||total;
  if(!n){alert("書き出す写真・動画がありません。先に検索してください。");return}
  if(!dest||!name){alert("書き出し先とアルバムの名前を入れてください");return}
  if(!confirm(`${n.toLocaleString()} 件を、${dest} の下の「${name}」に書き出します。よいですか？`))return;
  try{localStorage.setItem("albDest",dest)}catch(e){}
  $("#albGo").disabled=true;$("#albMsg").textContent="開始しています…";
  try{
    await post("/api/album/start",{q:query,asset_ids:ids,dest,name,mode:document.querySelector("input[name=albMode]:checked").value,
      opts:{old:$("#oOld").checked,loose:$("#oLoose").checked,nonlive:$("#oNonlive").checked,ai:$("#oAi").checked}});
    albPoll();
  }catch(e){$("#albMsg").textContent=e.message;$("#albGo").disabled=false}
};
$("#albCancel").onclick=()=>post("/api/album/cancel",{});
// ---- 場所を付ける
let selMode=false, sel=new Set(), places=[], sugMode=null, ptype="place";
const NOUN=()=>ptype==="tag"?"場面":"場所";
const post=async(u,b)=>{const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const j=await r.json();if(j.error)throw new Error(j.error);return j};
async function loadPlaces(keep){
  places=await api("/api/places?type="+ptype); const cur=keep||$("#plSel").value;
  $("#plSel").innerHTML=places.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}（見本 ${p.labelled}／自動 ${p.auto}）</option>`).join("");
  if(cur&&places.some(p=>p.id===cur))$("#plSel").value=cur;
}
function curPlace(){return places.find(p=>p.id===$("#plSel").value)}
function updSel(){document.querySelectorAll(".tile").forEach(t=>t.classList.toggle("sel",sel.has(+t.dataset.id)));$("#selN").textContent=sel.size?`${sel.size} 枚選択中`:""}
$("#selBtn").onclick=async()=>{selMode=!selMode;document.body.classList.toggle("selmode",selMode);$("#selBtn").textContent=selMode?"選択モードをやめる":"場所を付ける（選択モード）";if(selMode)await loadPlaces();else{sel.clear();updSel();$("#panel").classList.remove("on");if(sugMode){sugMode=null;search(query)}}};
$("#selAll").onclick=()=>{items.forEach(i=>sel.add(i.id));updSel()};
$("#selNone").onclick=()=>{sel.clear();updSel()};
async function label(mode){
  const p=curPlace(); if(!p||!sel.size)return;
  try{await post("/api/place/label",{asset_ids:[...sel],place_id:p.id,mode,type:ptype}); const n=sel.size; sel.clear();
    if(sugMode){items=items.filter(i=>!sel.has(i.id));}
    await loadPlaces(p.id);
    if(sugMode){await suggest(true)}else{render();updSel();$("#note").textContent=`${n} 枚に「${p.name}」（${NOUN()}）を${mode==="add"?"付けました":mode==="neg"?"『ではない』と記録しました":"取り消しました"}。`}
  }catch(e){alert(e.message)}
}
$("#plAdd").onclick=()=>label("add"); $("#plNeg").onclick=()=>label("neg"); $("#plRem").onclick=()=>label("remove");
$("#plNew").onclick=async()=>{
  let body={type:ptype};
  if(ptype==="tag"){
    const name=prompt("新しい場面の名前（例: 遊んでいる、甘えている、散歩している）"); if(!name)return;
    const al=prompt("別の言い方（カンマ区切り。検索で同じ場面として使います）例: 遊ぶ, 遊び, 遊んで","")||"";
    body={type:"tag",name,aliases:al.split(/[,、，]/).map(x=>x.trim()).filter(Boolean)};
  }else{
    const name=prompt("新しい場所の名前（例: ベランダ、公園、リビング）"); if(!name)return;
    const cat=prompt("種類を入力: indoor（屋内） / semi_outdoor（半屋外） / outdoor（屋外）","indoor")||"indoor";

function drawClusters(){

   cs.map((c,i)=>{const ci=fp.cpage*5+i;return `<div class="cl" data-ci="${ci}"><div class="h"><b>グループ ${ci+1}</b>（${c.size} 枚）<button data-act="ok">この人にする</button><button class="ghost" data-act="skip">あとで</button><button class="ghost" data-act="ign" title="人形・他人など、検索に使わない顔のグループ">このグループは使わない</button></div>

  try{const j=await api("/api/pet/clusters");PT.groups=j.groups;
    if(!j.groups.length){$("#ptBody").innerHTML='<div class="note">名前の付いていない写真のグループはありません。</div>';return}
    $("#ptBody").innerHTML=`<div class="note">似た写真のまとまりです（大きい順）。同じ子のグループを選んで「この子です」。人形・他人の子などは「使わない」。ダブルクリックで大きく表示。</div>`+j.groups.map((g,i)=>`<div class="cl" data-i="${i}"><div class="h"><b>${g.size.toLocaleString()} 枚</b><button class="ptA">全部この子です</button><button class="ghost ptI">使わない</button><button class="ghost ptM">もっと見る</button></div><div class="fgrid">${g.sample.map(a=>ptTile({asset_id:a})).join("")}</div></div>`).join("");
    document.querySelectorAll("#ptBody .cl").forEach(cl=>{const g=PT.groups[+cl.dataset.i];ptBind(cl);
      cl.querySelector(".ptA").onclick=async()=>{const p=ptCur();if(!p)return alert("先にペットを選ぶか、新しく追加してください");
        if(!confirm(`このグループの ${g.size.toLocaleString()} 枚すべてを「${p.name}」にします。`))return;
        await ptDo("/api/pet/label",{asset_ids:g.ids,pet_id:p.id,mode:"add"});await ptLoad(p.id);ptClusters()};
      cl.querySelector(".ptI").onclick=async()=>{if(!confirm(`このグループの ${g.size.toLocaleString()} 枚を「使わない」にします。`))return;
        await ptDo("/api/pet/ignore",{asset_ids:g.ids,on:true});await ptLoad(ptCur()&&ptCur().id);ptClusters()};
      cl.querySelector(".ptM").onclick=()=>{const box=cl.querySelector(".fgrid");const n=box.children.length;
        box.insertAdjacentHTML("beforeend",g.ids.slice(n,n+60).map(a=>ptTile({asset_id:a})).join("")+"");ptBind(cl)}});
  }catch(e){alert(e.message);PT.mode=null}
}
async function ptList(kind,more){
  const p=ptCur();if(!p)return;if(!more){PT.items=[];PT.sel=new Set();PT.off=0}
  const url=kind==="sim"?"/api/pet/suggest":"/api/pet/review";
  const j=await api(`${url}?pet=${encodeURIComponent(p.id)}&kind=${PT.kind}&limit=60&offset=${PT.off}`);
  PT.items=PT.items.concat(j.items);PT.off+=j.items.length;PT.total=j.total;
  const rv=kind==="rv";
  $("#ptBody").innerHTML=(rv?`<div class="note">「${esc(p.name)}」の見本を、他と似ていない順に並べます。違う子が混じっていたら選んで外す／付け直します。</div><div style="margin:4px 0"><label><input type="radio" name="ptk" value="human" ${PT.kind==="human"?"checked":""}> 名前を付けた写真</label> <label><input type="radio" name="ptk" value="ai" ${PT.kind==="ai"?"checked":""}> 自動で付いた写真</label></div>`:`<div class="note">「${esc(p.name)}」に似た、名前のない写真です（似ている順）。合うものを選んで「この子です」。</div>`)+
   `<div class="note">${PT.total.toLocaleString()} 枚　<span id="ptN"></span></div><div class="fgrid">${PT.items.map(ptTile).join("")}</div>
   <div class="bar2">${rv?'<button id="ptRm">名前を外す</button> <select id="ptTo"></select> <button class="ghost" id="ptMv">この子に付け直す</button>':'<button id="ptAdd">選んだ写真をこの子にする</button> <button class="ghost" id="ptNeg">この子ではない</button> <button id="ptRest" title="違う写真だけをクリックで選び、「この子ではない」「使わない」で除いてから、残りをまとめて付けます">表示中の残りを全部この子にする</button> <button class="ghost" id="ptAll">全部選ぶ</button> <button class="ghost" id="ptNone">選択を解除</button>'} <button class="ghost" id="ptIg">使わない</button> <button class="ghost" id="ptMore">もっと見る</button></div>`;
  ptBind($("#ptBody"));
  if(rv){$("#ptTo").innerHTML=PT.pets.filter(x=>x.id!==p.id).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
    document.querySelectorAll("input[name=ptk]").forEach(r=>r.onchange=()=>{PT.kind=r.value;ptList("rv")});
    $("#ptRm").onclick=()=>ptAct("remove");$("#ptMv").onclick=()=>ptAct("move")}
  else{$("#ptAdd").onclick=()=>ptAct("add");$("#ptNeg").onclick=()=>ptAct("neg");
    $("#ptAll").onclick=()=>{PT.items.forEach(i=>PT.sel.add(i.asset_id));document.querySelectorAll("#ptBody .fc").forEach(e=>e.classList.add("on"));ptCount()};
    $("#ptNone").onclick=()=>{PT.sel=new Set();document.querySelectorAll("#ptBody .fc").forEach(e=>e.classList.remove("on"));ptCount()};
    $("#ptRest").onclick=async()=>{const rest=PT.items.map(i=>i.asset_id).filter(a=>!PT.sel.has(a));if(!rest.length)return alert("付ける写真がありません");
      if(!confirm(`表示中の ${PT.items.length} 枚のうち、選んでいない ${rest.length} 枚を「${p.name}」にします。\n（選んだ ${PT.sel.size} 枚は、そのまま残ります）`))return;
      await ptDo("/api/pet/label",{asset_ids:rest,pet_id:p.id,mode:"add"});await ptLoad(p.id);ptList(PT.mode)}}
  $("#ptIg").onclick=()=>ptAct("ignore");$("#ptMore").onclick=()=>ptList(kind,true);
  if(more)ptCount();
}
async function ptAct(mode){const p=ptCur();if(!p||!PT.sel.size)return alert("写真を選んでください");const ids=[...PT.sel];
  if(mode==="ignore")await ptDo("/api/pet/ignore",{asset_ids:ids,on:true});
  else if(mode==="move")await ptDo("/api/pet/label",{asset_ids:ids,pet_id:$("#ptTo").value,mode:"move",old:p.id});
  else await ptDo("/api/pet/label",{asset_ids:ids,pet_id:p.id,mode});
  await ptLoad(p.id);ptList(PT.mode)}
$("#petBtn").onclick=async()=>{const on=!$("#petPanel").classList.contains("on");$("#petPanel").classList.toggle("on",on);
  if(on){try{await ptLoad();ptClusters()}catch(e){alert(e.message)}}};
$("#ptTabCl").onclick=()=>ptClusters();
$("#ptTabSim").onclick=()=>{PT.mode="sim";ptList("sim").catch(e=>alert(e.message))};
$("#ptTabRv").onclick=()=>{PT.mode="rv";ptList("rv").catch(e=>alert(e.message))};
$("#ptSel").onchange=()=>{if(PT.mode==="sim"||PT.mode==="rv")ptList(PT.mode)};
$("#ptNew").onclick=async()=>{const name=prompt("ペットの名前（例: ポチ）");if(!name)return;
  const sp=prompt("種類（例: rabbit / rat / dog / cat）。空でもよい","")||"";
  const al=(prompt("別の呼び方（「,」区切り。空でもよい）","")||"").split(",").map(x=>x.trim()).filter(Boolean);
  const st=prompt("飼い始め（例 2015 または 2015-04-01。空でもよい）。同じ見た目の子を見分ける手掛かりになります","")||"";
  const en=prompt("お別れの日（空でもよい）","")||"";
  const r=await ptDo("/api/pet/add",{name,species:sp,aliases:al,start:st,end:en});if(r){await ptLoad(r.id)}};
$("#ptId").onclick=async()=>{if(!confirm("付けた名前を見本にして、残りの写真のペットを判定し直します。時間がかかります（バックグラウンドで実行）。"))return;
  const r=await ptDo("/api/pet/identify",{});if(!r)return;
  const t=setInterval(async()=>{const j=await api("/api/pet/job");$("#ptJob").textContent=j.running?"判定中… "+(j.log&&j.log.length?j.log[j.log.length-1]:""):(j.error?"エラー: "+j.error:"判定が終わりました");if(!j.running){clearInterval(t);ptLoad(ptCur()&&ptCur().id)}},3000)};
</script>
<script>
/* 公開版（MyPetFinder）の表示: 個人用の項目を隠し、解析の進み具合を出す */
(async()=>{
  let pub=false;try{pub=(await api("/api/mode")).public}catch(e){}
  const hideEmpty=()=>document.querySelectorAll("aside h3").forEach(h=>{const b=h.nextElementSibling;if(b&&b.classList.contains("btns")&&!b.children.length){h.style.display="none"}});
  setTimeout(hideEmpty,1500);
  if(!pub)return;
  window.__pub=true;
  ["#selBtn","#faceBtn"].forEach(x=>{const e=$(x);if(e)e.style.display="none"});
  document.title="MyPetFinder 検索";const h=document.querySelector("h1");if(h)h.textContent="MyPetFinder 検索";
  const P=$("#anaPanel");
  async function refresh(){
    let st;try{st=await api("/api/finder/status")}catch(e){return}
    const j=st.job,done=st.clip>0&&st.clip>=st.images&&st.dino>=st.images&&st.videos_done>=st.videos;
    if(j.running){P.classList.add("on");P.innerHTML=`<b>解析中: ${esc(j.stage)}</b> <span class="note">${esc((j.log[j.log.length-1]||"").slice(0,120))}</span><br><span class="note">時間がかかります（数万枚で数時間）。途中で閉じても、次回は続きから再開します。</span>`;setTimeout(refresh,3000);return}
    if(j.error){P.classList.add("on");P.innerHTML=`<b>解析でエラー</b> <span class="note">${esc(j.error)}</span> <button id="anaGo">もう一度</button>`}
    else if(!st.files||!done){P.classList.add("on");P.innerHTML=`<b>はじめに写真を解析します</b><br><span class="note">写真 ${st.images.toLocaleString()} 枚（解析済み ${Math.min(st.clip,st.dino).toLocaleString()} 枚）／動画 ${st.videos.toLocaleString()} 本（解析済み ${st.videos_done.toLocaleString()} 本）。写真はこのパソコンの外に出ません。</span><br><button id="anaGo">${st.files?"続きから解析する":"解析を始める"}</button>`}
    else if(!st.named){P.classList.add("on");P.innerHTML=`<b>解析が終わりました。次は、ペットに名前を付けます</b><br><span class="note">上の「ペットに名前を付ける」を押し、写真のグループに名前を付けてください。全部のグループに付ける必要はありません。名前を付けた分だけ、検索できます。</span>`}
    else P.classList.remove("on");
    const b=$("#anaGo");if(b)b.onclick=async()=>{try{await post("/api/finder/analyze",{});refresh()}catch(e){alert(e.message)}};
  }
  refresh();
  window.__refreshAna=refresh;
})();
</script>
